# Application stack: the Schema Studio app only.
#
# The PostgreSQL / MySQL databases the Migrations workflow targets live in a
# separate file (database.compose.yaml). Both files join a shared external
# Docker network (dsg-net) so the app can reach the databases by service name.
#
# One-time setup, then start the databases, then the app:
#
#   docker network create dsg-net                    # once (shared network)
#   docker compose -f database.compose.yaml up -d    # start the target databases
#   docker compose up --build                         # build + run the app
#
# Connection URLs for the Migrations / Imports workflows:
#   from the app container : postgresql://dev:dev@postgres:5432/dev
#                            mysql://dev:dev@mysql:3306/dev
#   from your host machine : postgresql://dev:dev@localhost:54321/dev
#                            mysql://dev:dev@localhost:54322/dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: database-schema-generator
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      # Optional: pin the credential-encryption master key so stored database
      # connections survive container rebuilds. Generate one with:
      #   openssl rand -hex 32
      # Without it (and without persisting /home/node/.database-schema-generator),
      # saved DB connections must be re-entered after the container is recreated.
      # CONNECTION_ENCRYPTION_KEY: 'replace-with-64-hex-chars'
    volumes:
      # All app data (projects, versions, SQL-Query .db files) — shares the
      # repo's src/database, so the container and host see the same app.db.
      - ./src/database:/app/src/database
      # Legacy per-connection key store.
      - ./secrets.json:/app/secrets.json
      # Reusable field templates (read-only — the app only reads this file).
      - ./field-templates.json:/app/field-templates.json:ro
      # Persist the credential-encryption master key so saved DB connections
      # survive container recreation. Without it the key regenerates each time
      # and previously-saved connections can no longer be decrypted (they vanish
      # from the list). Pin CONNECTION_ENCRYPTION_KEY above instead if you also
      # run the app locally and want connections to work in both places.
      - app-keys:/home/node/.database-schema-generator
    # Join the shared network so the app resolves the postgres / mysql
    # containers (from database.compose.yaml) by name — e.g. postgres:5432.
    networks:
      - dsg-net
    restart: unless-stopped

volumes:
  # Credential-encryption master key (mounted into the app above). A named volume
  # so it persists across container recreation; `docker compose down -v` clears it.
  app-keys:

# Shared with database.compose.yaml. Create it once: docker network create dsg-net
networks:
  dsg-net:
    external: true
    name: dsg-net
