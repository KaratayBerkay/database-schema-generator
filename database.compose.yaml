# PostgreSQL + MySQL databases that the Migrations / Imports workflows target.
# Joins the shared external network (dsg-net) so the app container can reach
# these by service name (postgres:5432 / mysql:3306). Create the network once:
#
#   docker network create dsg-net
#   docker compose -f database.compose.yaml up -d

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    ports:
      - '54321:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dsg-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d dev']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: dev
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - '54322:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - dsg-net
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -udev -pdev --silent']
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  mysql-data:

# Shared with docker-compose.yaml. Create it once: docker network create dsg-net
networks:
  dsg-net:
    external: true
    name: dsg-net
